<!DOCTYPE html>
<html>
<head>
  <title>Send Text Options</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1em;
      width: 400px;
    }
    h2 {
      font-size: 1.1em;
      border-bottom: 1px solid #ccc;
      padding-bottom: 0.3em;
    }
    .options-group {
      margin-top: 1em;
    }
    label {
      display: block;
      margin-bottom: 0.5em;
    }
    input[type="text"], input[type="number"] {
        width: 100%;
        padding: 4px;
        box-sizing: border-box;
    }
    #status {
      margin-top: 1em;
      color: green;
      font-weight: bold;
      height: 1em;
    }
  </style>
</head>
<body>
  <h1>Targeting Settings</h1>

  <h2>Targeting Mode</h2>
  <div class="options-group">
    <label><input type="radio" name="targetingMode" value="url" checked> Target by URL</label>
    <label><input type="radio" name="targetingMode" value="position"> Target by Position</label>
  </div>

  <div id="urlTargetGroup">
    <label for="targetUrl">Target URL:</label>
    <input type="text" id="targetUrl" placeholder="e.g., https://example.com/search">
  </div>

  <div id="positionTargetGroup" style="display: none;">
    <label for="tabPosition">Tab Position (1 = first tab):</label>
    <input type="number" id="tabPosition" min="1" step="1" value="1">
  </div>

  <h2>Submission Key</h2>
  <div class="options-group">
    <label><input type="radio" name="submitKey" value="ctrl-enter"> Ctrl+Enter</label>
    <label><input type="radio" name="submitKey" value="enter"> Enter</label>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
