<!DOCTYPE html>
<html>
<head>
  <title>Send Text Options</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1em;
      width: 300px;
    }
    h1 {
      font-size: 1.2em;
    }
    .options-group {
      margin-top: 1em;
    }
    label {
      display: block;
      margin-bottom: 0.5em;
    }
    #status {
      margin-top: 1em;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Icon Position Settings</h1>
  <p>Choose where the icon should appear next to selected text.</p>

  <div class="options-group">
    <label>
      <input type="radio" name="position" value="top-right">
      Top-Right of selection
    </label>
    <label>
      <input type="radio" name="position" value="top-left">
      Top-Left of selection
    </label>
    <label>
      <input type="radio" name="position" value="bottom-right">
      Bottom-Right of selection
    </label>
    <label>
      <input type="radio" name="position" value="bottom-left">
      Bottom-Left of selection
    </label>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
